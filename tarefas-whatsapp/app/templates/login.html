{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card" style="max-width: 360px; margin: 60px auto;">
  <h2>Entrar</h2>
  <form method="post" action="/login">
    <p><input type="email" name="email" placeholder="email" required style="width:100%"></p>
    <p><input type="password" name="senha" placeholder="senha" required style="width:100%"></p>
    <button type="submit" style="width:100%">Entrar</button>
  </form>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <p style="margin-top:16px; font-size:13px;">Não tem conta? <a href="/registrar">Cadastre-se</a></p>
</div>
{% endblock %}
